name: Build WebRTC VAD Wheels

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/webrtcvad-wheel/**
      - scripts/build_webrtcvad_wheels.sh
      - .github/workflows/build-webrtcvad-wheels.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: webrtcvad-wheel-linux-amd64
          - platform: linux/arm64
            artifact: webrtcvad-wheel-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheel
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p wheel-output
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --build-arg WEBRTCVAD_VERSION=2.0.14 \
            --progress plain \
            --output type=local,dest=wheel-output \
            scripts/webrtcvad-wheel
          test "$(find wheel-output -maxdepth 2 -name 'webrtcvad_wheels-*.whl' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('wheel-output').glob('webrtcvad_wheels-*.whl'))
          with ZipFile(wheel) as archive:
              assert 'webrtcvad.py' in archive.namelist(), wheel
          print(wheel.name)
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: wheel-output/*.whl
          if-no-files-found: error
