name: Build WebRTC VAD Wheels

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/webrtcvad-wheel/**
      - scripts/build_webrtcvad_wheels.sh
      - .github/workflows/build-webrtcvad-wheels.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: webrtcvad-wheel-linux-amd64
            machine: x86_64-linux-gnu.so
          - platform: linux/arm64
            artifact: webrtcvad-wheel-linux-arm64
            machine: aarch64-linux-gnu.so

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheel
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          mkdir -p wheel-output
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --build-arg WEBRTCVAD_VERSION=2.0.14 \
            --progress plain \
            --output type=local,dest=wheel-output \
            scripts/webrtcvad-wheel
          test "$(find wheel-output -maxdepth 2 -name 'webrtcvad_wheels-*.whl' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('wheel-output').glob('webrtcvad_wheels-*.whl'))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert 'webrtcvad.py' in names, wheel
              assert any(name.endswith(__import__('os').environ['TARGET_MACHINE']) for name in names), names
          print(wheel.name)
          PY

      - name: Import wheel in target Python
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "$PWD/wheel-output:/wheels:ro" \
            python:3.14-slim-trixie \
            python -m pip install --no-index --find-links /wheels webrtcvad-wheels==2.0.14
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "$PWD/wheel-output:/wheels:ro" \
            python:3.14-slim-trixie \
            sh -c 'python -m pip install --no-index --find-links /wheels webrtcvad-wheels==2.0.14 >/dev/null && python -c "import webrtcvad; print(webrtcvad.__file__)"'

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: wheel-output/*.whl
          if-no-files-found: error
